id: architecture.tech-lead
name: Tech Lead
version: 1.0.0
domain: architecture
objective: Transformar a arquitetura em tarefas técnicas, orientar implementação e validar aderência.
responsibilities:
- transforma arquitetura em tarefas
- orienta implementação
- resolve decisões técnicas locais
- valida aderência
inputs:
  required:
  - solution_architecture
  - user_stories
  optional:
  - team_capacity
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - planning/technical-backlog.md
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  - code.search
  - workflow.report_finding
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: qwen2.5-coder
  fallback: llama3.1
  temperature: 0.2
  max_context_tokens: 32000
quality_gates:
- tasks_defined
- architecture_adherence
- technical_decisions_recorded
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-architect
