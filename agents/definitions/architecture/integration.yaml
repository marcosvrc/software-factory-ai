id: architecture.integration
name: Arquiteto de Integração
version: 1.0.0
domain: architecture
objective: Definir APIs, eventos, contratos, versionamento e idempotência.
responsibilities:
- define APIs
- eventos
- contratos
- versionamento
- idempotência
inputs:
  required:
  - solution_architecture
  optional:
  - existing_apis
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - architecture/integration.md
  - architecture/api-contracts.md
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  - diagram.generate
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: qwen2.5-coder
  fallback: llama3.1
  temperature: 0.2
  max_context_tokens: 32000
quality_gates:
- apis_defined
- events_defined
- contracts_versioned
- idempotency_considered
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-architect
