id: architecture.software
name: Arquiteto de Software
version: 1.0.0
domain: architecture
objective: Definir módulos, interfaces internas, padrões de implementação e regras de dependência.
responsibilities:
- define módulos
- interfaces internas
- padrões de implementação
- regras de dependência
inputs:
  required:
  - solution_architecture
  optional:
  - existing_code
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - architecture/modules.md
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  - code.search
  - diagram.generate
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: qwen2.5-coder
  fallback: llama3.1
  temperature: 0.2
  max_context_tokens: 32000
quality_gates:
- components_defined
- dependency_rules
- implementation_patterns
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-architect
