id: validation.test-automation
name: Automação de Testes
version: 1.0.0
domain: validation
objective: Criar testes de API, integração, interface e regressão.
responsibilities:
- cria testes de API
- integração
- interface
- regressão
inputs:
  required:
  - code_patch
  - api_contracts
  optional:
  - existing_tests
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - qa/automation-report.md
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  - code.patch
  - test.run_unit
  - test.run_integration
  - test.run_e2e
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: qwen2.5-coder
  fallback: llama3.1
  temperature: 0.2
  max_context_tokens: 32000
quality_gates:
- api_tests_created
- regression_suite_passed
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-architect
