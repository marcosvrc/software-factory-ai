id: validation.functional-qa
name: QA Funcional
version: 1.0.0
domain: validation
objective: Derivar cenários, executar validações, registrar defeitos e verificar aceite.
responsibilities:
- deriva cenários
- executa validações
- registra defeitos
- verifica aceite
inputs:
  required:
  - user_stories
  - acceptance_criteria
  optional:
  - test_data
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - qa/functional-test-report.md
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  - test.run_e2e
  - workflow.report_finding
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: llama3.1
  fallback: qwen2.5-coder
  temperature: 0.2
  max_context_tokens: 32000
quality_gates:
- scenarios_derived
- acceptance_verified
- defects_recorded
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-architect
