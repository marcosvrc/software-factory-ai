id: validation.qa-lead
name: QA Lead
version: 1.0.0
domain: validation
objective: Definir a estratégia de qualidade, estabelecer cobertura e consolidar o parecer de QA.
responsibilities:
- define estratégia de qualidade
- estabelece cobertura
- consolida parecer
inputs:
  required:
  - user_stories
  - code_patch
  optional:
  - test_reports
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - qa/qa-verdict.md
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  - test.run_unit
  - test.run_integration
  - workflow.report_finding
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: llama3.1
  fallback: qwen2.5-coder
  temperature: 0.2
  max_context_tokens: 32000
quality_gates:
- acceptance_criteria_covered
- regression_approved
- no_critical_defects
- evidence_recorded
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-architect
