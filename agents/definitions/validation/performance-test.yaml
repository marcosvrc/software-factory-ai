id: validation.performance-test
name: Testes de Performance
version: 1.0.0
domain: validation
objective: Criar cenários de carga, medir latência e identificar gargalos.
responsibilities:
- cria cenários de carga
- mede latência
- identifica gargalos
inputs:
  required:
  - non_functional_requirements
  optional:
  - previous_benchmarks
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - qa/performance-report.md
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  - test.run_integration
  - workflow.report_finding
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: llama3.1
  fallback: qwen2.5-coder
  temperature: 0.2
  max_context_tokens: 32000
quality_gates:
- load_scenarios_defined
- latency_measured
- bottlenecks_identified
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-architect
