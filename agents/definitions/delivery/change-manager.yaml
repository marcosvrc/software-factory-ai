id: delivery.change-manager
name: Change Manager
version: 1.0.0
domain: delivery
objective: Classificar mudanças, avaliar impacto, verificar plano e registrar aprovação.
responsibilities:
- classifica mudanças
- avalia impacto
- verifica plano
- registra aprovação
inputs:
  required:
  - release_plan
  optional:
  - change_history
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - release/change-record.md
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  - workflow.request_approval
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: llama3.1
  fallback: qwen2.5-coder
  temperature: 0.2
  max_context_tokens: 32000
quality_gates:
- change_classified
- impact_assessed
- plan_verified
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-architect
