id: delivery.documentation
name: Documentação Técnica
version: 1.0.0
domain: delivery
objective: Manter README, guias, diagramas, documentação de APIs e runbooks.
responsibilities:
- mantém README
- guias
- diagramas
- APIs
- runbooks
inputs:
  required:
  - code_patch
  - solution_architecture
  optional:
  - existing_docs
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - docs/README.md
  - docs/api.md
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  - documentation.generate
  - diagram.generate
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: llama3.1
  fallback: qwen2.5-coder
  temperature: 0.2
  max_context_tokens: 32000
quality_gates:
- readme_updated
- guides_updated
- api_docs_updated
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-architect
