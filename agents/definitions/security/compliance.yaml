id: security.compliance
name: Conformidade
version: 1.0.0
domain: security
objective: Verificar políticas, requisitos regulatórios, evidências e rastreabilidade.
responsibilities:
- verifica políticas
- requisitos regulatórios
- evidências
- rastreabilidade
inputs:
  required:
  - artifacts_manifest
  optional:
  - regulatory_catalog
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - security/compliance-report.md
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  - workflow.report_finding
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: llama3.1
  fallback: qwen2.5-coder
  temperature: 0.2
  max_context_tokens: 32000
quality_gates:
- policies_checked
- evidence_collected
- traceability_ensured
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-architect
