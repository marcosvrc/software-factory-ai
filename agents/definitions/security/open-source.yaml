id: security.open-source
name: Open Source e Licenciamento
version: 1.0.0
domain: security
objective: Criar SBOM, verificar licenças, identificar incompatibilidades e monitorar componentes abandonados.
responsibilities:
- cria SBOM
- verifica licenças
- identifica incompatibilidades
- monitora componentes abandonados
inputs:
  required:
  - dependencies_manifest
  optional:
  - license_policy
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - security/sbom.json
  - security/license-report.md
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  - security.scan_dependencies
  - workflow.report_finding
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: llama3.1
  fallback: qwen2.5-coder
  temperature: 0.2
  max_context_tokens: 32000
quality_gates:
- sbom_created
- licenses_evaluated
- no_incompatible_license
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-architect
