id: security.ai-security
name: Segurança de IA
version: 1.0.0
domain: security
objective: Avaliar prompt injection, vazamento de dados, abuso de ferramentas e riscos de modelos.
responsibilities:
- avalia prompt injection
- vazamento de dados
- abuso de ferramentas
- riscos de modelos
inputs:
  required:
  - ai_components
  optional:
  - threat_model
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - security/ai-security-report.md
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  - workflow.report_finding
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: llama3.1
  fallback: qwen2.5-coder
  temperature: 0.2
  max_context_tokens: 32000
quality_gates:
- prompt_injection_assessed
- data_leak_assessed
- tool_abuse_assessed
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-architect
