id: security.legal
name: Jurídico
version: 1.0.0
domain: security
objective: Avaliar termos, licenças, contratos e propriedade intelectual.
responsibilities:
- avalia termos
- licenças
- contratos
- propriedade intelectual
inputs:
  required:
  - licenses_manifest
  optional:
  - contracts
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - security/legal-assessment.md
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  - workflow.report_finding
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: llama3.1
  fallback: qwen2.5-coder
  temperature: 0.2
  max_context_tokens: 32000
quality_gates:
- terms_reviewed
- licenses_reviewed
- ip_assessed
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- human-legal
