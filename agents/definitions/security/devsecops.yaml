id: security.devsecops
name: DevSecOps
version: 1.0.0
domain: security
objective: Integrar scanners ao pipeline, definir gates e verificar imagens e dependências.
responsibilities:
- integra scanners ao pipeline
- define gates
- verifica imagens e dependências
inputs:
  required:
  - pipeline_definition
  optional:
  - container_images
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - security/devsecops-report.md
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  - security.scan_dependencies
  - security.scan_container
  - workflow.report_finding
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: llama3.1
  fallback: qwen2.5-coder
  temperature: 0.2
  max_context_tokens: 32000
quality_gates:
- scanners_integrated
- gates_defined
- images_scanned
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-architect
