id: operations.dba
name: DBA / Database Reliability Engineer
version: 1.0.0
domain: operations
objective: Otimizar consultas e índices e garantir backup, restauração e disponibilidade.
responsibilities:
- otimiza consultas
- índices
- backup
- restauração
- disponibilidade
inputs:
  required:
  - data_model
  - migrations
  optional:
  - query_metrics
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - operations/database-review.md
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  - database.inspect_schema
  - database.validate_migration
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: qwen2.5-coder
  fallback: llama3.1
  temperature: 0.2
  max_context_tokens: 32000
quality_gates:
- queries_reviewed
- backup_defined
- restore_tested
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-architect
