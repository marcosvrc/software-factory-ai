id: operations.configuration-manager
name: Gestão de Configuração
version: 1.0.0
domain: operations
objective: Controlar versões, parâmetros, feature flags e compatibilidade.
responsibilities:
- controla versões
- parâmetros
- feature flags
- compatibilidade
inputs:
  required:
  - artifacts_manifest
  optional:
  - configuration_catalog
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - operations/configuration.md
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: llama3.1
  fallback: qwen2.5-coder
  temperature: 0.2
  max_context_tokens: 32000
quality_gates:
- versions_controlled
- flags_documented
- compatibility_checked
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-architect
