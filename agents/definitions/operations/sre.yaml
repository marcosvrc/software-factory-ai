id: operations.sre
name: SRE
version: 1.0.0
domain: operations
objective: Definir SLI e SLO, dashboards, alertas, runbooks e resiliência.
responsibilities:
- define SLI e SLO
- dashboards
- alertas
- runbooks
- resiliência
inputs:
  required:
  - solution_architecture
  - non_functional_requirements
  optional:
  - incident_history
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - operations/slo.md
  - operations/runbook.md
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  - workflow.report_finding
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: llama3.1
  fallback: qwen2.5-coder
  temperature: 0.2
  max_context_tokens: 32000
quality_gates:
- sli_slo_defined
- dashboards_defined
- alerts_defined
- runbook_created
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-architect
