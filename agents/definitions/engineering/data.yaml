id: engineering.data
name: Engenheiro de Dados
version: 1.0.0
domain: engineering
objective: Implementar pipelines, transformações, validação de qualidade e linhagem.
responsibilities:
- implementa pipelines
- transformações
- validação de qualidade
- linhagem
inputs:
  required:
  - data_model
  - technical_backlog
  optional:
  - existing_pipelines
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - code/data-pipeline-patch.diff
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  - code.search
  - code.patch
  - database.inspect_schema
  - test.run_unit
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: qwen2.5-coder
  fallback: llama3.1
  temperature: 0.1
  max_context_tokens: 32000
quality_gates:
- pipeline_tested
- quality_validated
- lineage_documented
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-architect
