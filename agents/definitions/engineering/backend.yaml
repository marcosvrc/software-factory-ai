id: engineering.backend
name: Desenvolvedor Backend
version: 1.0.0
domain: engineering
objective: Implementar serviços, regras de negócio, APIs, persistência, integrações e testes.
  Ao implementar ou alterar código, preencher "code_files" no resultado com o conteúdo COMPLETO
  e funcional de cada arquivo (nunca apenas o nome em "artifacts" sem o conteúdo correspondente).
responsibilities:
- implementa serviços
- regras de negócio
- APIs
- persistência
- integrações
- testes
inputs:
  required:
  - technical_backlog
  - solution_architecture
  optional:
  - existing_code
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - code/patch.diff
  - code/tests/
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  - repository.diff
  - repository.create_branch
  - repository.commit
  - code.search
  - code.patch
  - code.format
  - test.run_unit
  - quality.run_lint
  - quality.run_type_check
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: qwen2.5-coder
  fallback: llama3.1
  temperature: 0.1
  max_context_tokens: 32000
quality_gates:
- build_success
- lint_passed
- types_passed
- unit_tests_passed
- min_coverage
- no_secrets
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-architect
