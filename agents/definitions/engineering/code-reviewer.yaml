id: engineering.code-reviewer
name: Revisor de Código
version: 1.0.0
domain: engineering
objective: Revisar código verificando legibilidade, aderência à arquitetura, testes, segurança básica
  e manutenibilidade.
responsibilities:
- verifica legibilidade
- aderência à arquitetura
- testes
- segurança básica
- manutenibilidade
inputs:
  required:
  - code_patch
  - solution_architecture
  optional:
  - coding_standards
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - review/code-review-report.md
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  - repository.diff
  - code.search
  - quality.run_lint
  - quality.run_complexity
  - workflow.report_finding
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: qwen2.5-coder
  fallback: llama3.1
  temperature: 0.2
  max_context_tokens: 32000
quality_gates:
- architecture_adherence
- readability
- error_handling
- sufficient_tests
- no_critical_findings
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-developer
