id: engineering.integration
name: Engenheiro de Integração
version: 1.0.0
domain: engineering
objective: Implementar conectores, contratos, consumidores e produtores de eventos.
responsibilities:
- implementa conectores
- contratos
- consumidores
- produtores de eventos
inputs:
  required:
  - api_contracts
  - technical_backlog
  optional:
  - existing_integrations
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - code/integration-patch.diff
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  - code.search
  - code.patch
  - test.run_integration
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: qwen2.5-coder
  fallback: llama3.1
  temperature: 0.1
  max_context_tokens: 32000
quality_gates:
- contracts_respected
- idempotency_implemented
- integration_tests_passed
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-architect
