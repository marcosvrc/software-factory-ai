id: governance.flow-manager
name: Flow Manager / Scrum Master
version: 1.0.0
domain: governance
objective: Acompanhar o fluxo, identificar bloqueios, controlar WIP, acompanhar dependências e gerar retrospectiva.
responsibilities:
- acompanha fluxo
- identifica bloqueios
- controla trabalho em andamento
- acompanha dependências
- gera retrospectiva
inputs:
  required:
  - demand_title
  - demand_description
  optional:
  - workflow_metrics
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - governance/flow-report.md
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  - workflow.report_finding
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: llama3.1
  fallback: qwen2.5-coder
  temperature: 0.2
  max_context_tokens: 32000
quality_gates:
- flow_assessed
- blockers_identified
- wip_controlled
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-architect
