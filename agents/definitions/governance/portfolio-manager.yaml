id: governance.portfolio-manager
name: Gestor de Portfólio
version: 1.0.0
domain: governance
objective: Priorizar projetos, identificar conflitos, acompanhar benefícios e custos e consolidar indicadores.
responsibilities:
- prioriza projetos
- identifica conflitos
- acompanha benefícios e custos
- consolida indicadores
inputs:
  required:
  - portfolio_state
  optional:
  - business_metrics
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - governance/portfolio-report.md
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: llama3.1
  fallback: qwen2.5-coder
  temperature: 0.2
  max_context_tokens: 32000
quality_gates:
- projects_prioritized
- conflicts_identified
- indicators_consolidated
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-architect
