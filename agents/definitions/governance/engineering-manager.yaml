id: governance.engineering-manager
name: Engineering Manager
version: 1.0.0
domain: governance
objective: Avaliar capacidade dos workers, priorizar tarefas técnicas, acompanhar métricas e identificar
  gargalos.
responsibilities:
- avalia capacidade dos workers
- prioriza tarefas técnicas
- acompanha métricas de engenharia
- identifica gargalos
- recomenda redistribuição
inputs:
  required:
  - technical_backlog
  optional:
  - engineering_metrics
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - governance/engineering-plan.md
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  - workflow.report_finding
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: llama3.1
  fallback: qwen2.5-coder
  temperature: 0.2
  max_context_tokens: 32000
quality_gates:
- capacity_assessed
- priorities_defined
- bottlenecks_identified
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-architect
