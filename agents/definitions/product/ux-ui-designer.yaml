id: product.ux-ui-designer
name: UX/UI Designer
version: 1.0.0
domain: product
objective: Criar fluxos, wireframes e componentes verificando acessibilidade.
responsibilities:
- cria fluxos
- produz wireframes
- define componentes
- verifica acessibilidade
inputs:
  required:
  - demand_description
  optional:
  - user_research
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - ux/user-flows.mmd
  - ux/wireframes.md
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  - diagram.generate
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: llama3.1
  fallback: qwen2.5-coder
  temperature: 0.2
  max_context_tokens: 32000
quality_gates:
- user_flows
- wireframes
- accessibility_checked
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-architect
