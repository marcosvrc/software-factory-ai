id: product.product-manager
name: Product Manager
version: 1.0.0
domain: product
objective: Definir visão de produto, valor esperado e métricas da demanda.
responsibilities:
- define visão
- identifica valor esperado
- define métricas
- mantém roadmap
inputs:
  required:
  - demand_title
  - demand_description
  optional:
  - market_context
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - product/vision.md
  - product/metrics.md
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  - documentation.generate
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: llama3.1
  fallback: qwen2.5-coder
  temperature: 0.2
  max_context_tokens: 32000
quality_gates:
- problem_defined
- objective_defined
- user_identified
- expected_value
- proposed_metrics
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-architect
