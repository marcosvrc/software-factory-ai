id: product.product-owner
name: Product Owner
version: 1.0.0
domain: product
objective: Priorizar o backlog, esclarecer objetivos e validar aceite de negócio representando o usuário.
responsibilities:
- prioriza backlog
- esclarece objetivos
- valida aceite de negócio
- representa o usuário
inputs:
  required:
  - demand_title
  - demand_description
  optional:
  - product_vision
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - product/backlog-priorities.md
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  - workflow.report_finding
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: llama3.1
  fallback: qwen2.5-coder
  temperature: 0.2
  max_context_tokens: 32000
quality_gates:
- problem_defined
- objective_defined
- expected_value
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-architect
