id: product.ux-researcher
name: UX Researcher
version: 1.0.0
domain: product
objective: Criar hipóteses sobre usuários, definir pesquisas, sintetizar necessidades e registrar riscos
  de usabilidade.
responsibilities:
- cria hipóteses sobre usuários
- define pesquisas
- sintetiza necessidades
- registra riscos de usabilidade
inputs:
  required:
  - demand_description
  optional:
  - product_vision
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - ux/research-hypotheses.md
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: llama3.1
  fallback: qwen2.5-coder
  temperature: 0.2
  max_context_tokens: 32000
quality_gates:
- user_identified
- usability_risks
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-architect
