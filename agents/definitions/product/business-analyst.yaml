id: product.business-analyst
name: Analista de Negócios
version: 1.0.0
domain: product
objective: Identificar regras de negócio, modelar processos, mapear atores e documentar exceções.
responsibilities:
- identifica regras
- modela processos
- mapeia atores
- documenta exceções
inputs:
  required:
  - demand_description
  optional:
  - product_vision
outputs:
  schema: schemas/agent-result.schema.json
  artifacts:
  - product/business-rules.md
  - product/process-model.mmd
tools:
  allowed:
  - repository.read
  - artifact.read
  - artifact.write
  - artifact.list
  - diagram.generate
  denied:
  - shell.unrestricted
  - production.deploy
  - secrets.read
model:
  provider: ollama
  primary: llama3.1
  fallback: qwen2.5-coder
  temperature: 0.2
  max_context_tokens: 32000
quality_gates:
- business_rules
- process_model
- actors_mapped
- exceptions_documented
retry:
  max_attempts: 2
  on_failure: human_review
escalation:
- tech-lead
- human-architect
