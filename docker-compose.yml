services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - factory-network

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://factory:factory@postgres:5432/factory
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://factory:factory@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - factory-network

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    command: python -m orchestrator.main
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://factory:factory@postgres:5432/factory
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://factory:factory@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - factory-network

  product-worker:
    build:
      context: .
      dockerfile: workers/product/Dockerfile
    command: python -m workers.product.main
    env_file: [.env]
    environment:
      WORKER_DOMAIN: product
      RABBITMQ_URL: amqp://factory:factory@rabbitmq:5672/
      DATABASE_URL: postgresql+asyncpg://factory:factory@postgres:5432/factory
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - factory-network

  architecture-worker:
    build:
      context: .
      dockerfile: workers/architecture/Dockerfile
    command: python -m workers.architecture.main
    env_file: [.env]
    environment:
      WORKER_DOMAIN: architecture
      RABBITMQ_URL: amqp://factory:factory@rabbitmq:5672/
      DATABASE_URL: postgresql+asyncpg://factory:factory@postgres:5432/factory
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - factory-network

  engineering-worker:
    build:
      context: .
      dockerfile: workers/engineering/Dockerfile
    command: python -m workers.engineering.main
    env_file: [.env]
    environment:
      WORKER_DOMAIN: engineering
      RABBITMQ_URL: amqp://factory:factory@rabbitmq:5672/
      DATABASE_URL: postgresql+asyncpg://factory:factory@postgres:5432/factory
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      SANDBOX_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - workspaces:/workspaces
      - artifacts:/artifacts
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - factory-network

  validation-worker:
    build:
      context: .
      dockerfile: workers/validation/Dockerfile
    command: python -m workers.validation.main
    env_file: [.env]
    environment:
      WORKER_DOMAIN: validation
      RABBITMQ_URL: amqp://factory:factory@rabbitmq:5672/
      DATABASE_URL: postgresql+asyncpg://factory:factory@postgres:5432/factory
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - workspaces:/workspaces:ro
      - artifacts:/artifacts
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - factory-network

  security-worker:
    build:
      context: .
      dockerfile: workers/security/Dockerfile
    command: python -m workers.security.main
    env_file: [.env]
    environment:
      WORKER_DOMAIN: security
      RABBITMQ_URL: amqp://factory:factory@rabbitmq:5672/
      DATABASE_URL: postgresql+asyncpg://factory:factory@postgres:5432/factory
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - workspaces:/workspaces:ro
      - artifacts:/artifacts
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - factory-network

  operations-worker:
    build:
      context: .
      dockerfile: workers/operations/Dockerfile
    command: python -m workers.operations.main
    env_file: [.env]
    environment:
      WORKER_DOMAIN: operations
      RABBITMQ_URL: amqp://factory:factory@rabbitmq:5672/
      DATABASE_URL: postgresql+asyncpg://factory:factory@postgres:5432/factory
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - workspaces:/workspaces:ro
      - artifacts:/artifacts
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - factory-network

  delivery-worker:
    build:
      context: .
      dockerfile: workers/delivery/Dockerfile
    command: python -m workers.delivery.main
    env_file: [.env]
    environment:
      WORKER_DOMAIN: delivery
      RABBITMQ_URL: amqp://factory:factory@rabbitmq:5672/
      DATABASE_URL: postgresql+asyncpg://factory:factory@postgres:5432/factory
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - workspaces:/workspaces:ro
      - artifacts:/artifacts
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - factory-network

  governance-worker:
    build:
      context: .
      dockerfile: workers/governance/Dockerfile
    command: python -m workers.governance.main
    env_file: [.env]
    environment:
      WORKER_DOMAIN: governance
      RABBITMQ_URL: amqp://factory:factory@rabbitmq:5672/
      DATABASE_URL: postgresql+asyncpg://factory:factory@postgres:5432/factory
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - factory-network

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: factory
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - factory-network

  redis:
    image: redis:8
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - factory-network

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: factory
      RABBITMQ_DEFAULT_PASS: factory
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - factory-network

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: factory
      MINIO_ROOT_PASSWORD: local-development-password
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - factory-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infrastructure/otel/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - factory-network

  prometheus:
    image: prom/prometheus
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - factory-network

  loki:
    image: grafana/loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - factory-network

  grafana:
    image: grafana/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - factory-network

networks:
  factory-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  prometheus-data:
  loki-data:
  grafana-data:
  workspaces:
  artifacts:
