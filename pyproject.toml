[project]
name = "software-factory"
version = "0.1.0"
description = "Fabrica de software local multiagente com orquestracao explicita (LangGraph + Ollama)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "aio-pika>=9.4",
    "minio>=7.2",
    "httpx>=0.27",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=1.0",
    "langchain-ollama>=0.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "opentelemetry-api>=1.26",
    "opentelemetry-sdk>=1.26",
    "opentelemetry-exporter-otlp>=1.26",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
    "prometheus-client>=0.20",
    "langfuse>=2.40",
    "GitPython>=3.1",
    "docker>=7.1",
    "tenacity>=8.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "types-PyYAML",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["backend/tests", "orchestrator/tests", "tests", "shared", "agents"]

[tool.setuptools.packages.find]
include = ["shared*", "agents*", "workers*", "tools*", "orchestrator*", "sandbox*"]
