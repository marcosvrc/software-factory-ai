global:
  scrape_interval: 15s

scrape_configs:
  - job_name: factory-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
